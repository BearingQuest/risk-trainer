name: CI

# Required checks (.github/rulesets/main.json requires them by name): check, gitleaks, semgrep,
# pip-audit, zizmor and iac. e2e runs too but isn't required.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install
        run: uv sync --locked
      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check (mypy)
        run: uv run mypy
      - name: Tests (pytest)
        run: uv run pytest --cov --cov-report=term
      - name: Validate content (rt validate)
        run: uv run rt validate

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # check out the repository; a job block replaces the workflow grant
      security-events: write # upload the SARIF report to code scanning
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum pinned)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan git history
        run: >-
          ./gitleaks git --no-banner --redact --exit-code 1
          --report-format sarif --report-path gitleaks.sarif .
      - name: Upload SARIF to code scanning
        # Skipped for fork PRs (read-only token) and when the scan wrote no report.
        if: >-
          always() && hashFiles('gitleaks.sarif') != '' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  semgrep:
    name: semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the repository; a job block replaces the workflow grant
      security-events: write # upload the SARIF report to code scanning
    container:
      image: semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan
        run: semgrep scan --config p/default --error --metrics=off --sarif-output=semgrep.sarif
      - name: Drop inline-suppressed results
        # Code scanning ignores SARIF suppressions, so approved inline skips would open alerts.
        if: always() && hashFiles('semgrep.sarif') != ''
        run: >-
          jq '.runs[].results |= ((. // []) | map(select(any(.suppressions[]?; .kind == "inSource") | not)))'
          semgrep.sarif > semgrep.tmp && mv semgrep.tmp semgrep.upload.sarif
      - name: Upload SARIF to code scanning
        # Skipped for fork PRs (read-only token) and when the scan wrote no report.
        if: >-
          always() && hashFiles('semgrep.upload.sarif') != '' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.upload.sarif
          category: semgrep

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install
        run: uv sync --locked
      - name: Audit locked dependencies
        run: make audit

  iac:
    name: iac
    # Runs on every PR so it can be a required check; the steps no-op until infra/ exists.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the repository; a job block replaces the workflow grant
      security-events: write # upload the SARIF report to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No infra/ yet
        if: hashFiles('infra/**/*.tf') == ''
        run: echo "infra/ has no Terraform yet; skipping terraform and checkov."
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: hashFiles('infra/**/*.tf') != ''
      - name: terraform fmt
        if: hashFiles('infra/**/*.tf') != ''
        run: terraform fmt -check -recursive infra
      - name: terraform validate
        if: hashFiles('infra/**/*.tf') != ''
        run: |
          for dir in $(find infra -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u); do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            # Mocked-provider tests (R11-R15); they make no AWS calls.
            if [ -d "$dir/tests" ]; then terraform -chdir="$dir" test; fi
          done
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: hashFiles('infra/**/*.tf') != ''
      - name: checkov
        if: hashFiles('infra/**/*.tf') != ''
        run: >-
          uvx checkov==3.3.21 --directory infra --framework terraform --compact --quiet
          -o cli -o sarif --output-file-path console,checkov.sarif
      - name: Drop inline-suppressed results
        # Code scanning ignores SARIF suppressions, so approved inline skips would open alerts.
        if: always() && hashFiles('checkov.sarif') != ''
        run: >-
          jq '.runs[].results |= ((. // []) | map(select(any(.suppressions[]?; .kind == "inSource") | not)))'
          checkov.sarif > checkov.tmp && mv checkov.tmp checkov.upload.sarif
      - name: Upload SARIF to code scanning
        # Skipped for fork PRs (read-only token) and when the scan wrote no report.
        if: >-
          always() && hashFiles('checkov.upload.sarif') != '' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: checkov.upload.sarif
          category: checkov

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # Fails on any finding. --exclude-newer is the release date plus one day; the version
      # is bumped by hand (Dependabot doesn't track it).
      - name: Audit the workflows
        run: uvx --exclude-newer 2026-11-03 zizmor@1.32.0 .github

  e2e:
    name: e2e
    # Not a required check yet; Playwright browser tests for the exercise form (R6).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Browsers and their system deps are baked in, so there's no apt or browser download.
    # The tag must match playwright in uv.lock (R14 test).
    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble@sha256:72bd171a9ffc2b4b59532aaa6210e21014d07093120dc25528870c0b840da1f0
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install
        run: uv sync --locked
      # The image has no make; this is the Makefile's e2e recipe (R14 test keeps them equal).
      - name: Browser tests (pytest -m e2e)
        run: uv run pytest -m e2e tests/e2e
