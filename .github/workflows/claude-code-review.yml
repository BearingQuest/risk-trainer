name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

permissions: {}

jobs:
  claude-review:
    # Dependabot runs get no Actions secrets, so skip them rather than fail (docs/decisions.md).
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # check out the repository
      pull-requests: read # read the pull request the review is about
      issues: read # read linked issues and conversation threads
      id-token: write # claude-code-action exchanges the OIDC token for its GitHub App token

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # The runner has no bubblewrap or socat, and this repo's .claude/settings.json
          # enables the sandbox with failIfUnavailable, so the review would abort at start.
          # --settings ranks above project settings, so it turns the sandbox off for this
          # run only. The reviewer has no Bash (--allowedTools is the inline-comment tool
          # alone) and the sandbox wraps only Bash, so nothing is lost; every deny rule in
          # the repo settings still applies. Needs Claude Code 2.1.285 or later.
          claude_args: |
            --model claude-sonnet-5-5
            --settings '{"sandbox":{"enabled":false}}'
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

